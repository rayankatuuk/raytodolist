<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAYTODO APP | TO DO LIST</title>
    <link rel="shortcut icon" href="./assets/images/raytodo.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <main
      class="font-lato bg-cover bg-center"
      style="background-image: url(./assets/images/Background.jpg)"
    >
      <!-- Card Primary -->
      <div class="max-w-screen-sm mx-auto">
        <header
          class="bg-main/2 py-9 text-center backdrop-blur-[2px] text-white"
        >
          <h1 class="text-lg font-bold hover:text-red-600">RAYTODO APP</h1>
          <p class="text-lg font-bold mt-4">Date :</p>
          <p id="hari-tanggal" class="text-lg font-bold"></p>

          <div class="flex flex-col">
            <!-- Profile Input -->
            <div id="profile-input" style="display: block">
              <input
                id="nama-input"
                type="text"
                class="text-lg font-bold bg-main/14 rounded-xl px-2 py-2 my-4 w-full max-w-xs mx-auto text-center placeholder:text-white focus:outline-none"
                placeholder="Nama"
              />
              <input
                id="jabatan-input"
                type="text"
                class="text-lg font-bold bg-main/14 rounded-xl px-2 py-2 text-center w-full max-w-xs mx-auto placeholder:text-white focus:outline-none"
                placeholder="Jabatan"
              />
              <div class="flex justify-center mt-2">
                <button
                  id="save-profile-btn"
                  class="bg-main/10 hover:bg-green-600 text-white w-[200px] font-bold py-2 px-8 rounded-xl mt-2"
                >
                  Simpan
                </button>
              </div>
            </div>

            <!-- Profile Display -->
            <div id="profile-display" style="display: none">
              <h2
                id="nama"
                class="text-lg font-bold px-2 py-1 w-full max-w-xs mx-auto text-center mt-2 placeholder:text-white focus:outline-none"
              ></h2>
              <p
                id="jabatan"
                class="text-lg font-bold px-2 py-1 w-full max-w-xs mx-auto text-center placeholder:text-white focus:outline-none"
              ></p>
              <button
                id="edit-profile-btn"
                class="bg-main/10 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded mt-2 focus:outline-none"
              >
                Edit
              </button>
            </div>

            <!-- Profile Edit -->
            <div id="profile-edit" style="display: none">
              <input
                id="nama-input-edit"
                type="text"
                class="text-lg font-bold bg-main/14 rounded-xl px-2 my-2 py-2 w-full max-w-xs mx-auto text-center placeholder:text-white focus:outline-none"
              />
              <input
                id="jabatan-input-edit"
                type="text"
                class="text-lg font-bold bg-main/14 rounded-xl px-2 py-2 my-2 w-full max-w-xs mx-auto text-center placeholder:text-white focus:outline-none"
              />
              <div class="flex justify-center flex-row gap-2 mt-2">
                <button
                  id="save-profile-edit-btn"
                  class="bg-main/10 hover:bg-green-600 text-white font-bold py-2 px-4 rounded mt-2"
                >
                  Simpan
                </button>
                <button
                  id="cancel-profile-edit-btn"
                  class="bg-main/10 hover:bg-red-700 text-white font-bold py-2 px-4 rounded mt-2"
                >
                  Batal
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- To Do List -->
        <div
          class="container mx-auto p-8 -mt-6 rounded-t-[30px] min-h-screen bg-main/50 backdrop-blur-[2px] text-white"
        >
          <div class="flex flex-col mb-4">
            <textarea
              id="todo-input"
              class="w-full p-4 bg-main/10 rounded-xl px-2 placeholder:text-white focus:outline-none"
              placeholder="Write your todo..."
            ></textarea>
            <p class="mt-4 font-semibold">Priority</p>
            <select
              id="prioritas"
              class="w-full py-3 bg-main/10 rounded-xl my-2 text-center focus:bg-main/20 focus-visible:bg-main"
            >
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
            <button
              id="submit-btn"
              class="bg-green-500/30 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-xl my-6"
            >
              Submit
            </button>
          </div>

          <!-- To Do List and Done List -->
          <div class="flex flex-col mb-4">
            <h2 class="text-lg font-bold">To-Do :</h2>
            <ul id="todo-ul" class="list-none p-0 m-0"></ul>
          </div>
          <div class="border border-gray-400 w-full my-6"></div>
          <div class="flex flex-col mb-4">
            <h2 class="text-lg font-bold">DONE :</h2>
            <ul id="done-ul" class="list-none p-0 m-0"></ul>
          </div>
          <div class="border border-gray-400 w-full my-6"></div>
          <button
            id="delete-btn"
            class="bg-red-500/30 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-xl my-6 w-full"
          >
            Delete All
          </button>
        </div>
      </div>
    </main>

    <script src="./scripts/main.js"></script>
  </body>
</html>
